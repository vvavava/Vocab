<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어장">
<meta name="theme-color" content="#fdf7f2">
<title>단어장</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#fdf7f2;--card:#fff;--line:#eee6f8;--ink:#3d3556;--sub:#b3adc4;--mid:#7d7694;--lav:#b9a4ee;--lavbg:#f1ecfd;--peach:#ffd9c7;--mint:#d6f2e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px}
.ghost{background:none;border:0;color:var(--mid);font-size:14px;padding:6px 4px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;background:#fff;color:var(--mid);padding:7px 14px;font-size:14px;cursor:pointer;box-shadow:0 1px 2px rgba(60,40,100,.06)}
.chip.on{background:var(--lav);color:#fff}
.chip b{margin-left:6px;color:#e07a8a}
.panel{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:0 4px 18px rgba(90,70,140,.07);margin-bottom:18px}
.in{width:100%;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);padding:6px 0;font-size:16px}
.in.w{font-size:22px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px}
.in.p{font-size:16px;color:var(--mid)}
.in.ex{font-size:16px;color:var(--sub);font-style:italic}
select.in{font-size:16px;color:var(--mid);padding:6px 0;width:auto}
textarea.in{resize:none}
.search{width:100%;border:0;outline:0;background:#fff;border-radius:16px;padding:13px 16px;font-size:16px;color:var(--ink);box-shadow:0 2px 10px rgba(90,70,140,.06);margin-bottom:14px;font-family:inherit}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.btn{border:0;border-radius:14px;background:var(--lav);color:#fff;font-size:15px;font-weight:600;padding:11px 18px;cursor:pointer}
.btn.soft{background:var(--lavbg);color:var(--mid)}
.btn.danger{background:#f8d7de;color:#b5475c}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 2px 10px rgba(90,70,140,.05);cursor:pointer;border-left:4px solid var(--peach)}
.card:active{transform:scale(.99)}
.word{font-size:24px;font-weight:700;letter-spacing:-.3px}
.pron{font-size:13px;color:var(--sub);margin-left:8px}
.mean{font-size:16px;margin-top:4px}
.ex{font-size:13px;color:var(--sub);font-style:italic;margin-top:6px;line-height:1.45}
.tag{display:inline-block;margin-top:8px;font-size:11px;background:var(--mint);color:#4d8a72;padding:3px 9px;border-radius:999px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.intro{text-align:center;padding-top:28vh}
.intro .lead{color:var(--mid);line-height:1.6;margin:14px 0 26px}
.overlay{position:fixed;inset:0;background:rgba(61,53,86,.25);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
label.lbl{font-size:12px;color:var(--sub);display:block;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="overlay"></div>
<div id="toast" class="toast"></div>

<script>
const CLIENT_ID = '305517203153-l92tp8tpvfncs7rtpp41c5du69kho4av.apps.googleusercontent.com';

const SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
const API = 'https://sheets.googleapis.com/v4/spreadsheets';
const HEAD = ['단어','발음','뜻','예문','설명','카테고리'];

const rowOf = w => [w.word, w.pron, w.meaning, w.example, w.note, w.category];

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- 로그인 ---------- */
window.addEventListener('load', () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: r => {
      if (r.error) return toast('로그인에 실패했어요');
      token = r.access_token;
      localStorage.setItem('tok', JSON.stringify({ t: token, e: Date.now() + (r.expires_in - 60) * 1000 }));
      start();
    }
  });
  const saved = JSON.parse(localStorage.getItem('tok') || 'null');
  if (saved && saved.e > Date.now()) { token = saved.t; start(); }
  else render();
});

function login(){ tokenClient.requestAccessToken(); }
function logout(){ token = null; localStorage.removeItem('tok'); render(); }

async function start(){
  render(true);
  try { await ensureSheet(); await loadAll(); }
  catch (e) { console.error(e); if (e.message !== 'auth') toast('데이터를 불러오지 못했어요'); }
  render();
}

/* ---------- 구글 시트 API ---------- */
async function api(url, opt = {}){
  const res = await fetch(url, {
    method: opt.method || 'GET',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: opt.body
  });
  if (res.status === 401){ logout(); throw new Error('auth'); }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function ensureSheet(){
  if (sheetId) return;
  const r = await api(API, { method: 'POST', body: JSON.stringify({
    properties: { title: 'My Words' },
    sheets: [{ properties: { title: 'words' } }, { properties: { title: 'categories' } }]
  })});
  sheetId = r.spreadsheetId;
  localStorage.setItem('sheetId', sheetId);
  await api(`${API}/${sheetId}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({
    valueInputOption: 'RAW',
    data: [
      { range: 'words!A1:F1', values: [HEAD] },
      { range: 'categories!A1:A2', values: [['카테고리'], ['일반']] }
    ]
  })});
}
